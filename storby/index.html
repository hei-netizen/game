<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script type="importmap">
{ "imports": { "three": "./three.module.min.js" } }

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './GLTFLoader.js';
import { mergeGeometries, deinterleaveGeometry } from './BufferGeometryUtils.js';

/* ==========================================================================
   STORBY v2 — prosedural by med PBR-materialer
   Alt genereres i kode: fasader, normalkart, ruhetskart, geometri.
   ========================================================================== */

/* ---------------------------- KONFIG ------------------------------------ */
const CITY_W=3000, CITY_D=2000, HW=CITY_W/2, HD=CITY_D/2;
const FH=3.6;                       // etasjehøyde
const TEX_W=16.0, TEX_H=14.4;       // meter per fasade-teksturrepetisjon
const GROUND_H=5.4;                 // høyde på gateplan-sonen (butikk/inngang)
const CHX=10, CHZ=7;
const CHW=CITY_W/CHX, CHD=CITY_D/CHZ;

// materialslots
const M_GLASS=0,M_OFFICE=1,M_BRICK=2,M_IND=3,M_PLASTER=4,
      M_SHOP=5,M_BASE=6,M_ROOF=7,M_CONC=8,NMAT=9;
const D_DOWN=0,D_MID=1,D_RES=2,D_IND=3,D_PARK=4;
const D_NAME=['Sentrum','Midtbyen','Boligstrøk','Industriområdet','Parken'];
const D_COL=['#3f5f8f','#5b7ba4','#9c7857','#7a6349','#3d6b4c'];

/* ---------------------------- RNG + STØY -------------------------------- */
let SEED=20260829, NOFF=0, PKX=540, PKZ=260;
let rand=mulberry32(SEED);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=(a,b)=>a+(b-a)*rand();
const rndi=(a,b)=>Math.floor(a+(b-a+1)*rand());
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function h2(x,y){let h=Math.imul(x,374761393)+Math.imul(y,668265263)|0;
  h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
function noise(x,y){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi;
  const s=t=>t*t*(3-2*t),u=s(fx),v=s(fy);
  return h2(xi,yi)*(1-u)*(1-v)+h2(xi+1,yi)*u*(1-v)+h2(xi,yi+1)*(1-u)*v+h2(xi+1,yi+1)*u*v}

/* ---------------------------- TERRENG ----------------------------------- */
/* Kvartalene planeres som flate platåer (slik ekte byer gjør det), mens
   veiene følger terrenget. Kantsteinen blir da en støttemur der det er bratt. */
let TER_AMP=1.0;                      // 0 = helt flatt
function terrainH(x,z){
  if(TER_AMP<=0)return 0;
  // Bølgelengdene må være korte nok til at vi krysser MANGE støyceller over
  // byens 3 km. Med 1500 m krysset vi bare 2 celler og hele byen ble ett
  // flatt platå.
  const a=noise(x/520+NOFF*.137, z/520+NOFF*.137);
  const b=noise(x/225+13.1,      z/225+4.7);
  const c=noise(x/95 +31.3,      z/95 +17.5);
  let h=(a-.5)*32+(b-.5)*11+(c-.5)*3.2;
  // Fjellene reiser seg utenfor byen: vekt 0 i dalen, 1 ute ved kanten.
  const r=Math.hypot(x/1.30,z);
  const w=cl((r-560)/620,0,1), w2=w*w;
  const m1=noise(x/880+3.31, z/880+8.17);
  const m2=noise(x/340+21.7, z/340+5.53);
  const m3=noise(x/140+44.2, z/140+12.9);
  return (h+(Math.pow(m1,1.7)*250+m2*80+m3*22)*w2)*TER_AMP;
}
// kvartals-platåer i eget rutenett, så vi vet hva spilleren står på
let padHash=new Map();
function addPad(b){
  for(let cx=Math.floor(b.x0/GRID);cx<=Math.floor(b.x1/GRID);cx++)
    for(let cz=Math.floor(b.z0/GRID);cz<=Math.floor(b.z1/GRID);cz++){
      const k=cx+':'+cz;let a=padHash.get(k);if(!a){a=[];padHash.set(k,a);}a.push(b);
    }
}
function groundAt(x,z){
  const a=padHash.get(Math.floor(x/GRID)+':'+Math.floor(z/GRID));
  if(a)for(const b of a)
    if(x>=b.x0&&x<=b.x1&&z>=b.z0&&z<=b.z1)return b.pad;
  return terrainH(x,z);
}

/* ---------------------------- TEKSTUR-VERKTØY --------------------------- */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h||w;return c}
function tex(canvas,linear,rep){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(!linear)t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=8;
  if(rep)t.repeat.set(rep[0],rep[1]);
  return t;
}
// Høydekart -> normalkart (Sobel)
function toNormal(src,strength){
  const S=src.width, d=src.getContext('2d').getImageData(0,0,S,S).data;
  const out=cv(S), g=out.getContext('2d'), img=g.createImageData(S,S), o=img.data;
  const H=(x,y)=>d[((((y%S)+S)%S)*S+(((x%S)+S)%S))*4]/255;
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y-1)-H(x,y+1))*strength;   // canvas-y peker ned, uv-v peker opp
    let nx=-dx,ny=-dy,nz=1;
    const l=Math.sqrt(nx*nx+ny*ny+nz*nz);
    const i=(y*S+x)*4;
    o[i]=(nx/l*.5+.5)*255; o[i+1]=(ny/l*.5+.5)*255; o[i+2]=(nz/l*.5+.5)*255; o[i+3]=255;
  }
  g.putImageData(img,0,0); return out;
}
const rgb=(r,g,b)=>'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
// ruhet i grønn kanal, metallisk i blå — three.js leser nøyaktig de kanalene
const rmv=(rough,metal)=>rgb(0,rough*255,metal*255);
function grain(g,S,n,alpha){
  for(let i=0;i<n;i++){
    g.fillStyle='rgba(0,0,0,'+(Math.random()*alpha).toFixed(3)+')';
    g.fillRect(Math.random()*S,Math.random()*S,1+Math.random()*2,1+Math.random()*2);
  }
}

/* ---------------------------- FASADER ----------------------------------- */
// Hver fasade lager 4 kart: albedo, høyde->normal, ruhet/metall, emissive (nattlys)
function facadeSet(kind){
  const S=512,N=4,C=S/N;
  const A=cv(S),Hg=cv(S),R=cv(S),E=cv(S);
  const a=A.getContext('2d'),h=Hg.getContext('2d'),r=R.getContext('2d'),e=E.getContext('2d');

  let wall,win,frame,ww,wh,lit,wRough,wMetal,sill;
  if(kind==='glass')      {wall='#33414f';win='#4a6d85';frame='#212c36';ww=.90;wh=.86;lit=.28;wRough=.62;wMetal=.05;sill=false;}
  else if(kind==='office'){wall='#a49d90';win='#33424d';frame='#8b857a';ww=.62;wh=.56;lit=.34;wRough=.80;wMetal=.02;sill=true;}
  else if(kind==='brick') {wall='#8a5142';win='#32343d';frame='#d6cfc2';ww=.44;wh=.60;lit=.48;wRough=.92;wMetal=0;  sill=true;}
  else if(kind==='plaster'){wall='#c8bfae';win='#3a3c44';frame='#e8e2d6';ww=.46;wh=.62;lit=.44;wRough=.88;wMetal=0; sill=true;}
  else                    {wall='#7e807a';win='#3b4a52';frame='#63665f';ww=.54;wh=.32;lit=.14;wRough=.85;wMetal=.10;sill=false;}

  a.fillStyle=wall;a.fillRect(0,0,S,S);
  h.fillStyle=rgb(128,128,128);h.fillRect(0,0,S,S);
  r.fillStyle=rmv(wRough,wMetal);r.fillRect(0,0,S,S);
  e.fillStyle='#000';e.fillRect(0,0,S,S);

  if(kind==='brick'){                                   // murstein
    const bh=8,bw=19;
    for(let y=0,row=0;y<S;y+=bh,row++)
      for(let x=(row%2?-bw/2:0);x<S;x+=bw){
        a.fillStyle='rgba(0,0,0,'+(0.04+Math.random()*0.13).toFixed(3)+')';
        a.fillRect(x,y,bw-2,bh-2);
        a.fillStyle='rgba(255,228,205,'+(Math.random()*0.06).toFixed(3)+')';
        a.fillRect(x+1,y+1,bw-4,bh-4);
        h.fillStyle=rgb(150,150,150);h.fillRect(x+1,y+1,bw-3,bh-3);   // stein står frem
      }
  }
  if(kind==='industrial'){                              // bølgeblikk
    for(let x=0;x<S;x+=8){
      a.fillStyle='rgba(255,255,255,.055)';a.fillRect(x,0,4,S);
      a.fillStyle='rgba(0,0,0,.11)';       a.fillRect(x+4,0,4,S);
      h.fillStyle=rgb(178,178,178);h.fillRect(x,0,4,S);
      h.fillStyle=rgb(80,80,80);  h.fillRect(x+4,0,4,S);
    }
  }
  if(kind==='glass'){                                   // etasjebånd mellom vindusrekker
    for(let y=0;y<S;y+=C){
      a.fillStyle='rgba(0,0,0,.26)';a.fillRect(0,y,S,5);
      h.fillStyle=rgb(196,196,196); h.fillRect(0,y,S,5);
      r.fillStyle=rmv(.75,.35);     r.fillRect(0,y,S,5);
    }
  }
  if(kind==='plaster'){                                 // pussvariasjon
    for(let i=0;i<140;i++){
      a.fillStyle='rgba(0,0,0,'+(Math.random()*0.05).toFixed(3)+')';
      const w=20+Math.random()*90;
      a.fillRect(Math.random()*S,Math.random()*S,w,w*0.6);
    }
  }
  grain(a,S,7000,0.07);
  grain(h,S,3000,0.05);

  for(let cy=0;cy<N;cy++)for(let cx=0;cx<N;cx++){
    const ox=cx*C,oy=cy*C,w=C*ww,hh=C*wh;
    const x=ox+(C-w)/2,y=oy+(C-hh)/2;

    // karm (står ut)
    a.fillStyle=frame;a.fillRect(x-4,y-4,w+8,hh+8);
    h.fillStyle=rgb(205,205,205);h.fillRect(x-4,y-4,w+8,hh+8);
    r.fillStyle=rmv(.62,.15);r.fillRect(x-4,y-4,w+8,hh+8);

    // glasset (trukket inn)
    const g=a.createLinearGradient(x,y,x,y+hh);
    const t=0.72+Math.random()*0.56;
    g.addColorStop(0,shade(win,1.42*t));
    g.addColorStop(.5,shade(win,0.80*t));
    g.addColorStop(1,shade(win,1.12*t));
    a.fillStyle=g;a.fillRect(x,y,w,hh);
    h.fillStyle=rgb(64,64,64);h.fillRect(x,y,w,hh);
    r.fillStyle=rmv(.06,.88);r.fillRect(x,y,w,hh);      // blankt og speilende

    if(kind!=='glass'){                                  // sprosse
      a.fillStyle='rgba(240,240,240,.16)';a.fillRect(x+w/2-1,y,2,hh);
      h.fillStyle=rgb(150,150,150);h.fillRect(x+w/2-1,y,2,hh);
    }
    if(sill){                                            // vinduskarm nede
      a.fillStyle=shade(frame,1.08);a.fillRect(x-6,y+hh+3,w+12,5);
      h.fillStyle=rgb(230,230,230);h.fillRect(x-6,y+hh+3,w+12,5);
      // rennestriper under karmen — det som får bygg til å se brukt ut
      for(let k=0;k<7;k++){
        const sx=x-4+Math.random()*(w+8);
        a.fillStyle='rgba(38,32,26,'+(0.05+Math.random()*0.10).toFixed(3)+')';
        a.fillRect(sx,y+hh+8,1+Math.random()*3,10+Math.random()*(C*0.42));
      }
    }
    if(Math.random()<lit){                               // opplyst vindu om natten
      const warm=Math.random()<0.74;
      e.fillStyle=warm?rgb(255,180+Math.random()*45,112+Math.random()*55)
                      :rgb(176+Math.random()*45,212+Math.random()*40,255);
      e.globalAlpha=.5+Math.random()*.5;
      e.fillRect(x,y,w,hh);e.globalAlpha=1;
    }
  }
  return {map:tex(A),normalMap:tex(toNormal(Hg,2.6),true),rmMap:tex(R,true),emi:tex(E,true)};
}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  return rgb(Math.min(255,(n>>16)*f),Math.min(255,((n>>8)&255)*f),Math.min(255,(n&255)*f));
}

/* --------------------- GATEPLAN (butikk / inngang) ---------------------- */
// Egen tekstur for de nederste 5,4 m. Dette er den største enkeltforskjellen
// mellom "boks med vinduer" og noe som ser ut som en ekte gate.
function shopSet(kind){
  const S=512,BAYS=4,B=S/BAYS;
  const A=cv(S),Hg=cv(S),R=cv(S),E=cv(S);
  const a=A.getContext('2d'),h=Hg.getContext('2d'),r=R.getContext('2d'),e=E.getContext('2d');
  const res=(kind==='res');
  a.fillStyle=res?'#6d5346':'#3e4149';a.fillRect(0,0,S,S);
  h.fillStyle=rgb(128,128,128);h.fillRect(0,0,S,S);
  r.fillStyle=rmv(.86,0);r.fillRect(0,0,S,S);
  e.fillStyle='#000';e.fillRect(0,0,S,S);

  // sokkel i granitt nederst
  const plinth=S*0.13;
  a.fillStyle=res?'#4c4239':'#33363c';a.fillRect(0,S-plinth,S,plinth);
  h.fillStyle=rgb(168,168,168);h.fillRect(0,S-plinth,S,plinth);
  r.fillStyle=rmv(.55,.05);r.fillRect(0,S-plinth,S,plinth);

  const awn=['#8c3b32','#2f5a44','#294a6b','#7a6428','#5a3a5e'];
  for(let i=0;i<BAYS;i++){
    const ox=i*B, m=B*0.09;
    const x=ox+m, w=B-m*2, y=S*0.20, hh=S-plinth-y-4;
    const isDoor=Math.random()<(res?0.55:0.28);

    if(isDoor){                                        // inngangsdør
      const dw=w*0.44, dx=x+(w-dw)/2;
      a.fillStyle=res?'#3c2f27':'#23262b';a.fillRect(x,y,w,hh);
      h.fillStyle=rgb(112,112,112);h.fillRect(x,y,w,hh);
      a.fillStyle=res?'#6a4a33':'#2c3138';a.fillRect(dx,y+hh*0.18,dw,hh*0.82);
      h.fillStyle=rgb(190,190,190);h.fillRect(dx-4,y+hh*0.18-4,dw+8,hh*0.82+4);
      r.fillStyle=rmv(.35,.25);r.fillRect(dx,y+hh*0.18,dw,hh*0.82);
      a.fillStyle='rgba(255,235,190,.30)';a.fillRect(dx+4,y+hh*0.22,dw-8,hh*0.30);
      e.fillStyle=rgb(255,206,140);e.globalAlpha=.75;
      e.fillRect(dx+4,y+hh*0.22,dw-8,hh*0.30);e.globalAlpha=1;
    } else {                                           // butikkvindu
      a.fillStyle='#1b2026';a.fillRect(x,y,w,hh);
      const gg=a.createLinearGradient(x,y,x,y+hh);
      gg.addColorStop(0,'#586c7d');gg.addColorStop(.55,'#2b353f');gg.addColorStop(1,'#3d4a55');
      a.fillStyle=gg;a.fillRect(x+5,y+5,w-10,hh-10);
      h.fillStyle=rgb(72,72,72);h.fillRect(x+5,y+5,w-10,hh-10);
      h.fillStyle=rgb(200,200,200);h.fillRect(x,y,w,5);
      r.fillStyle=rmv(.05,.92);r.fillRect(x+5,y+5,w-10,hh-10);
      // varer/hyller i vinduet
      for(let k=0;k<4;k++){

        a.fillRect(x+10+Math.random()*(w-30),y+hh*0.45+Math.random()*hh*0.4,
                   8+Math.random()*22,6+Math.random()*16);
      }
      e.fillStyle=rgb(255,232,196);e.globalAlpha=.62;
      e.fillRect(x+5,y+5,w-10,hh-10);e.globalAlpha=1;
      if(!res&&Math.random()<0.55){                    // markise
        a.fillStyle=awn[(Math.random()*awn.length)|0];
        a.fillRect(x-3,y-S*0.055,w+6,S*0.062);
        h.fillStyle=rgb(228,228,228);h.fillRect(x-3,y-S*0.055,w+6,S*0.062);
        a.fillStyle='rgba(0,0,0,.22)';
        for(let s=0;s<8;s++)a.fillRect(x-3+s*(w+6)/8,y-S*0.055,2,S*0.062);

}

/* ---------------------------- GEOMETRI ---------------------------------- */
// KHR_mesh_quantization lagrer posisjoner og UV som normaliserte heltall, og
// dequantiseringen ligger i nodens matrise. Ganger man matrisen inn i et
// heltallsbuffer blir geometrien ødelagt — bilene ble til eksploderte klumper.
// Derfor konverteres alt til Float32 (denormalisert) FØR matrisen brukes.
function tilFloat32(g){
  for(const navn in g.attributes){
    const a=g.attributes[navn];
    if(a.array instanceof Float32Array&&!a.normalized)continue;
    const n=a.itemSize,ut=new Float32Array(a.count*n);
    for(let i=0;i<a.count;i++){
      ut[i*n]=a.getX(i);
      if(n>1)ut[i*n+1]=a.getY(i);
      if(n>2)ut[i*n+2]=a.getZ(i);
      if(n>3)ut[i*n+3]=a.getW(i);
    }
    g.setAttribute(navn,new THREE.BufferAttribute(ut,n));
  }
  return g;
}

function Buf(){return{p:[],n:[],u:[],c:[]}}
function quad(b,ax,ay,az,bx,by,bz,cx,cy,cz,dx,dy,dz,nx,ny,nz,u0,v0,u1,v1,col){
  b.p.push(ax,ay,az,bx,by,bz,cx,cy,cz, ax,ay,az,cx,cy,cz,dx,dy,dz);
  for(let i=0;i<6;i++){b.n.push(nx,ny,nz);b.c.push(col[0],col[1],col[2]);}
  b.u.push(u0,v0,u1,v0,u1,v1, u0,v0,u1,v1,u0,v1);
}
function tri(b,ax,ay,az,bx,by,bz,cx,cy,cz,nx,ny,nz,ua,va,ub,vb,uc,vc,col){
  b.p.push(ax,ay,az,bx,by,bz,cx,cy,cz);
  for(let i=0;i<3;i++){b.n.push(nx,ny,nz);b.c.push(col[0],col[1],col[2]);}
  b.u.push(ua,va,ub,vb,uc,vc);
}
function bufGeo(b){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(b.p),3));
  g.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(b.n),3));
  g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(b.u),2));
  g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(b.c),3));
  g.computeBoundingSphere();
  return g;
}
// 4 vegger med heltalls teksturrepetisjon -> vinduer blir aldri kuttet på midten
function walls(b,x0,x1,y0,y1,z0,z1,ru,rd,rv,col){
  quad(b,x0,y0,z1,x1,y0,z1,x1,y1,z1,x0,y1,z1, 0,0,1, 0,0,ru,rv,col);
  quad(b,x1,y0,z0,x0,y0,z0,x0,y1,z0,x1,y1,z0, 0,0,-1,0,0,ru,rv,col);
  quad(b,x1,y0,z1,x1,y0,z0,x1,y1,z0,x1,y1,z1, 1,0,0, 0,0,rd,rv,col);
  quad(b,x0,y0,z0,x0,y0,z1,x0,y1,z1,x0,y1,z0,-1,0,0, 0,0,rd,rv,col);
}
function slab(b,x0,x1,y,z0,z1,s,col){
  quad(b,x0,y,z1,x1,y,z1,x1,y,z0,x0,y,z0, 0,1,0, 0,0,(x1-x0)/s,(z1-z0)/s,col);
}
// gesims/brystning rundt takkanten
function parapet(b,x0,x1,y,z0,z1,h,e,col){
  const X0=x0-e,X1=x1+e,Z0=z0-e,Z1=z1+e;
  walls(b,X0,X1,y,y+h,Z0,Z1,cl(Math.round((X1-X0)/4),1,30),cl(Math.round((Z1-Z0)/4),1,30),1,col);
  slab(b,X0,X1,y+h,Z1-e*2,Z1,2,col); slab(b,X0,X1,y+h,Z0,Z0+e*2,2,col);
  slab(b,X0,X0+e*2,y+h,Z0+e*2,Z1-e*2,2,col); slab(b,X1-e*2,X1,y+h,Z0+e*2,Z1-e*2,2,col);
}
// saltak — gir boligstrøket en helt annen silhuett enn sentrum
function gable(b,x0,x1,y,z0,z1,h,col){
  const mz=(z0+z1)/2, dz=(z1-z0)/2, L=Math.sqrt(dz*dz+h*h);
  const ru=cl(Math.round((x1-x0)/4),1,24), rv=cl(Math.round(L/4),1,10);
  quad(b,x0,y,z0,x1,y,z0,x1,y+h,mz,x0,y+h,mz, 0,dz/L,-h/L, 0,0,ru,rv,col);
  quad(b,x1,y,z1,x0,y,z1,x0,y+h,mz,x1,y+h,mz, 0,dz/L, h/L, 0,0,ru,rv,col);
  tri(b,x0,y,z1,x0,y,z0,x0,y+h,mz,-1,0,0, 0,0,1,0,.5,1,col);
  tri(b,x1,y,z0,x1,y,z1,x1,y+h,mz, 1,0,0, 0,0,1,0,.5,1,col);
}

/* ---------------------------- BY ---------------------------------------- */
let streetsX=[],streetsZ=[],blocks=[],colliders=[],buildingCount=0;
const GRID=50; let hash=new Map();
function addCol(c){
  colliders.push(c);
  for(let cx=Math.floor(c.x0/GRID);cx<=Math.floor(c.x1/GRID);cx++)
    for(let cz=Math.floor(c.z0/GRID);cz<=Math.floor(c.z1/GRID);cz++){
      const k=cx+':'+cz;let a=hash.get(k);if(!a){a=[];hash.set(k,a);}a.push(c);
    }
}
function nearby(x,z){
  const out=[],cx=Math.floor(x/GRID),cz=Math.floor(z/GRID);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
    const a=hash.get((cx+i)+':'+(cz+j));
    if(a)for(const b of a)if(out.indexOf(b)<0)out.push(b);
  }
  return out;
}
function makeStreets(len){
  const out=[];let p=-len/2,i=0;
  while(p<len/2){
    const art=(i%5===0),w=art?26:15;
    out.push({p:p+w/2,w:w,art:art});
    p+=w+rnd(58,132);i++;
  }
  return out;
}
function districtAt(x,z){
  const r=Math.hypot(x/1.35,z);
  const n=noise(x/430+11.3+NOFF,z/430+7.7+NOFF);
  if(x>560&&r>470&&noise(x/330+3.1+NOFF,z/330+9.4+NOFF)>0.44)return D_IND;
  const rr=r+(n-.5)*280;
  if(rr<340)return D_DOWN;
  if(rr<740)return D_MID;
  return D_RES;
}
function isPark(x,z){
  if(Math.hypot((x+PKX)/1.25,z-PKZ)<250)return true;
  if(Math.hypot((x-880)/1.1,z+430)<130)return true;
  return noise(x/95+41.2+NOFF,z/95+17.9+NOFF)>0.80;
}
function subdivide(x0,z0,x1,z1,maxW,out,depth){
  const w=x1-x0,d=z1-z0;
  if(w<8||d<8)return;
  if((w<=maxW&&d<=maxW)||depth>=5){out.push([x0,z0,x1,z1]);return;}
  if(w>=d){const t=x0+w*rnd(.38,.62);subdivide(x0,z0,t,z1,maxW,out,depth+1);subdivide(t,z0,x1,z1,maxW,out,depth+1);}
  else{const t=z0+d*rnd(.38,.62);subdivide(x0,z0,x1,t,maxW,out,depth+1);subdivide(x0,t,x1,z1,maxW,out,depth+1);}
}

// Ett bygningsvolum: gateplan + fasade + tak, med heltalls teksturrepetisjon
function volume(ch,mw,x0,x1,y0,y1,z0,z1,col,useShop,shopMat){
  const w=x1-x0,d=z1-z0;
  let gy=y0;
  if(useShop&&(y1-y0)>GROUND_H+4){
    gy=y0+GROUND_H;
    walls(ch[shopMat],x0,x1,y0,gy,z0,z1,
      cl(Math.round(w/11),1,20),cl(Math.round(d/11),1,20),1,col);
  }
  const hu=y1-gy;
  walls(ch[mw],x0,x1,gy,y1,z0,z1,
    cl(Math.round(w/TEX_W),1,14),cl(Math.round(d/TEX_W),1,14),cl(Math.round(hu/TEX_H),1,44),col);
  slab(ch[M_ROOF],x0,x1,y1,z0,z1,8,col);
}

function generateCity(scene,mats,gm){
  streetsX=makeStreets(CITY_W);streetsZ=makeStreets(CITY_D);
  blocks=[];colliders=[];hash=new Map();padHash=new Map();buildingCount=0;

  const chunks=[];for(let i=0;i<CHX*CHZ;i++){const m=[];for(let k=0;k<NMAT;k++)m.push(Buf());chunks.push(m);}
  const chunkOf=(x,z)=>chunks[
    Math.min(CHZ-1,Math.max(0,Math.floor((z+HD)/CHD)))*CHX+
    Math.min(CHX-1,Math.max(0,Math.floor((x+HW)/CHW)))];
  const walk=Buf(),park=Buf(),curb=Buf(),cross=Buf();
  const trees=[],lamps=[],roofProps=[];
  const W=[1,1,1];

  for(let i=0;i<streetsX.length-1;i++)for(let j=0;j<streetsZ.length-1;j++){
    const bx0=streetsX[i].p+streetsX[i].w/2, bx1=streetsX[i+1].p-streetsX[i+1].w/2;
    const bz0=streetsZ[j].p+streetsZ[j].w/2, bz1=streetsZ[j+1].p-streetsZ[j+1].w/2;
    if(bx1-bx0<14||bz1-bz0<14)continue;
    const mx=(bx0+bx1)/2,mz=(bz0+bz1)/2;
    if(Math.hypot(mx/1.30,mz)>880)continue;      // utenfor: villmark
    const dist=isPark(mx,mz)?D_PARK:districtAt(mx,mz);
    // platået legges på snittet av hjørnene, og kantsteinen strekkes ned til
    // laveste terrengpunkt rundt kvartalet så det aldri blir hull
    const mxc=(bx0+bx1)/2, mzc=(bz0+bz1)/2;
    const cH=[terrainH(bx0,bz0),terrainH(bx1,bz0),terrainH(bx1,bz1),terrainH(bx0,bz1),
              terrainH(mxc,bz0),terrainH(mxc,bz1),terrainH(bx0,mzc),terrainH(bx1,mzc)];
    const pad=Math.max.apply(null,cH)+0.35;   // høyeste kant -> terrenget bryter aldri opp
    const foot=Math.min.apply(null,cH)-1.4;
    const B={x0:bx0,z0:bz0,x1:bx1,z1:bz1,d:dist,pad:pad};
    blocks.push(B); addPad(B);

    // fortauskant / støttemur
    const vr=Math.max(.1,(pad-foot)/2);
    quad(curb,bx0,foot,bz1,bx1,foot,bz1,bx1,pad,bz1,bx0,pad,bz1, 0,0,1, 0,0,(bx1-bx0)/2,vr,W);
    quad(curb,bx1,foot,bz0,bx0,foot,bz0,bx0,pad,bz0,bx1,pad,bz0, 0,0,-1,0,0,(bx1-bx0)/2,vr,W);
    quad(curb,bx1,foot,bz1,bx1,foot,bz0,bx1,pad,bz0,bx1,pad,bz1, 1,0,0, 0,0,(bz1-bz0)/2,vr,W);
    quad(curb,bx0,foot,bz0,bx0,foot,bz1,bx0,pad,bz1,bx0,pad,bz0,-1,0,0, 0,0,(bz1-bz0)/2,vr,W);

    if(dist===D_PARK){
      slab(park,bx0,bx1,pad,bz0,bz1,12,W);
      const n=Math.max(2,((bx1-bx0)*(bz1-bz0))/240|0);
      for(let t=0;t<n;t++)trees.push([rnd(bx0+4,bx1-4),rnd(bz0+4,bz1-4),rnd(.8,1.6),rand()*6.3,pad]);
      continue;
    }
    slab(walk,bx0,bx1,pad,bz0,bz1,4,W);

    const inset=dist===D_RES?5:4;
    const lx0=bx0+inset,lx1=bx1-inset,lz0=bz0+inset,lz1=bz1-inset;
    if(lx1-lx0<10||lz1-lz0<10)continue;
    const maxW=dist===D_DOWN?72:dist===D_MID?48:dist===D_RES?26:90;
    const lots=[];subdivide(lx0,lz0,lx1,lz1,maxW,lots,0);

    for(const L of lots){
      const gap=dist===D_RES?2.5:1.5;
      const x0=L[0]+gap,z0=L[1]+gap,x1=L[2]-gap,z1=L[3]-gap;
      const w=x1-x0,d=z1-z0;
      if(w<8||d<8)continue;
      if(dist===D_RES&&rand()<0.14)continue;

      // per-bygg fargetone via vertex colors — variasjon uten flere teksturer
      const tv=rnd(.80,1.16), hu=rnd(-.05,.05);
      const col=[cl(tv+hu,.5,1.4),cl(tv,.5,1.4),cl(tv-hu*.7,.5,1.4)];
      const ch=chunkOf((x0+x1)/2,(z0+z1)/2);
      let floors,mw,shopM=M_SHOP,useShop=true;

      if(dist===D_DOWN){floors=rndi(14,52);mw=rand()<.62?M_GLASS:M_OFFICE;}
      else if(dist===D_MID){floors=rndi(6,18);
        const p=rand();mw=p<.28?M_GLASS:p<.66?M_OFFICE:M_PLASTER;}
      else if(dist===D_RES){floors=rndi(2,5);
        mw=rand()<.62?M_BRICK:M_PLASTER;shopM=M_BASE;}
      else{floors=rndi(2,4);mw=M_IND;useShop=false;}

      const H=floors*FH, form=rand(), Y0=pad, Y1=pad+H;

      if(dist===D_IND){                                   // lagerhall
        volume(ch,mw,x0,x1,Y0,Y1,z0,z1,col,false,shopM);
        parapet(ch[M_CONC],x0,x1,Y1,z0,z1,0.7,0.3,col);
      }
      else if(floors>26){                                 // høyhus med tilbakespring
        const h1=Y0+Math.round(floors*rnd(.42,.58))*FH;
        volume(ch,mw,x0,x1,Y0,h1,z0,z1,col,useShop,shopM);
        const i1=Math.min(w,d)*0.11;
        const h2=floors>40?h1+Math.round((Y1-h1)/FH*.58)*FH:Y1;
        volume(ch,mw,x0+i1,x1-i1,h1,h2,z0+i1,z1-i1,col,false,shopM);
        parapet(ch[M_CONC],x0,x1,h1,z0,z1,1.0,0.35,col);
        if(h2<Y1){
          const i2=i1+Math.min(w,d)*0.11;
          volume(ch,mw,x0+i2,x1-i2,h2,Y1,z0+i2,z1-i2,col,false,shopM);
          parapet(ch[M_CONC],x0+i1,x1-i1,h2,z0+i1,z1-i1,1.0,0.35,col);
        }
        parapet(ch[M_CONC],x0+(h2<Y1?i1*2:i1),x1-(h2<Y1?i1*2:i1),Y1,
                z0+(h2<Y1?i1*2:i1),z1-(h2<Y1?i1*2:i1),1.2,0.4,col);
        if(floors>38)roofProps.push([(x0+x1)/2,Y1,(z0+z1)/2,1.3,rnd(12,30),1.3]);
      }
      else if(form<0.34&&w>18&&d>18&&dist!==D_RES){       // podium + tårn
        const pf=rndi(2,4), ph=Y0+pf*FH;
        volume(ch,mw,x0,x1,Y0,ph,z0,z1,col,useShop,shopM);
        parapet(ch[M_CONC],x0,x1,ph,z0,z1,0.8,0.35,col);
        const sx=rnd(.10,.32)*w, sz=rnd(.10,.32)*d;
        const tx0=x0+sx*rnd(.2,1.4), tz0=z0+sz*rnd(.2,1.4);
        const tx1=Math.min(x1-1,tx0+w-sx*1.5), tz1=Math.min(z1-1,tz0+d-sz*1.5);
        if(tx1-tx0>7&&tz1-tz0>7){
          volume(ch,mw,tx0,tx1,ph,Y1,tz0,tz1,col,false,shopM);
          parapet(ch[M_CONC],tx0,tx1,Y1,tz0,tz1,1.0,0.35,col);
        }
      }
      else if(dist===D_RES&&form<0.62&&w>14&&d>12){       // hus med saltak
        const eaves=Y1;
        volume(ch,mw,x0,x1,Y0,eaves,z0,z1,col,useShop,shopM);
        gable(ch[M_ROOF],x0,x1,eaves,z0,z1,rnd(2.6,4.6),[col[0]*.62,col[1]*.58,col[2]*.56]);
      }
      else if(dist===D_RES&&form<0.80&&w>20&&d>20){       // L-form
        const sp=rnd(.42,.6);
        volume(ch,mw,x0,x0+w*sp,Y0,Y1,z0,z1,col,useShop,shopM);
        const h2=Y0+Math.max(2,floors-rndi(0,2))*FH;
        volume(ch,mw,x0+w*sp,x1,Y0,h2,z0,z0+d*rnd(.5,.78),col,useShop,shopM);
        parapet(ch[M_CONC],x0,x0+w*sp,Y1,z0,z1,0.6,0.28,col);
      }
      else{                                               // rett volum
        volume(ch,mw,x0,x1,Y0,Y1,z0,z1,col,useShop,shopM);
        parapet(ch[M_CONC],x0,x1,Y1,z0,z1,dist===D_RES?0.6:0.9,dist===D_RES?0.25:0.33,col);
      }

      const np=Math.min(5,Math.max(1,(w*d)/300|0));
      for(let k=0;k<np;k++)
        roofProps.push([rnd(x0+3,x1-3),Y1,rnd(z0+3,z1-3),rnd(1.6,4.4),rnd(1,2.9),rnd(1.6,4.4)]);
      addCol({x0:x0,x1:x1,z0:z0,z1:z1,top:Y1});
      buildingCount++;
    }
  }

  // fotgjengerfelt i hovedkryss
  for(const sx of streetsX)if(sx.art)for(const sz of streetsZ)if(sz.art){
    const hwd=sx.w/2,hzd=sz.w/2,cy=terrainH(sx.p,sz.p)+0.05;
    slab(cross,sx.p-hwd,sx.p+hwd,cy,sz.p+hzd,sz.p+hzd+5,5.5,W);
    slab(cross,sx.p-hwd,sx.p+hwd,cy,sz.p-hzd-5,sz.p-hzd,5.5,W);
    slab(cross,sx.p+hwd,sx.p+hwd+5,cy,sz.p-hzd,sz.p+hzd,5.5,W);
    slab(cross,sx.p-hwd-5,sx.p-hwd,cy,sz.p-hzd,sz.p+hzd,5.5,W);
  }
  for(const s of streetsX)if(s.art)for(let z=-HD+30;z<HD;z+=46){
    lamps.push([s.p-s.w/2+2,z]);lamps.push([s.p+s.w/2-2,z]);}
  for(const s of streetsZ)if(s.art)for(let x=-HW+30;x<HW;x+=46){
    lamps.push([x,s.p-s.w/2+2]);lamps.push([x,s.p+s.w/2-2]);}

  const group=new THREE.Group();
  for(let i=0;i<chunks.length;i++)for(let k=0;k<NMAT;k++){
    const b=chunks[i][k];if(!b.p.length)continue;
    const m=new THREE.Mesh(bufGeo(b),mats[k]);
    m.castShadow=true;m.receiveShadow=true;group.add(m);
  }
  const add=(b,mat,shadow)=>{if(!b.p.length)return;
    const m=new THREE.Mesh(bufGeo(b),mat);m.receiveShadow=true;
    if(shadow)m.castShadow=true;group.add(m);};
  add(walk,gm.walk);add(park,gm.grass);add(curb,gm.curb,true);add(cross,gm.cross);

  // midtstriper som korte segmenter, hver lagt på terrenget
  const dash=Buf();
  for(const s of streetsX)if(s.art)
    for(let z=-HD+6;z<HD-10;z+=11){
      const y=Math.max(terrainH(s.p,z),terrainH(s.p,z+4))+0.08;
      slab(dash,s.p-0.28,s.p+0.28,y,z,z+4,1,W);
    }
  for(const s of streetsZ)if(s.art)
    for(let x=-HW+6;x<HW-10;x+=11){
      const y=Math.max(terrainH(x,s.p),terrainH(x+4,s.p))+0.08;
      slab(dash,x,x+4,y,s.p-0.28,s.p+0.28,1,W);
    }
  add(dash,gm.dashMat);

  const dm=new THREE.Object3D();
  if(trees.length){
    const tm=new THREE.InstancedMesh(new THREE.CylinderGeometry(.22,.36,4,7),gm.bark,trees.length);
    const fm=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2.5,1),gm.leaf,trees.length);
    tm.castShadow=fm.castShadow=true;fm.receiveShadow=true;
    const c=new THREE.Color();
    fm.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(trees.length*3),3);
    trees.forEach((t,i)=>{
      const[x,z,s,r,py]=t;
      dm.position.set(x,py+2*s,z);dm.scale.set(s,s,s);dm.rotation.set(0,r,0);
      dm.updateMatrix();tm.setMatrixAt(i,dm.matrix);
      dm.position.set(x,py+4.5*s,z);dm.scale.set(s*rnd(.85,1.25),s*rnd(.9,1.35),s*rnd(.85,1.25));
      dm.updateMatrix();fm.setMatrixAt(i,dm.matrix);
      c.setHSL(.23+rand()*.10,.42+rand()*.26,.40+rand()*.16);fm.setColorAt(i,c);
    });
    fm.instanceColor.needsUpdate=true;group.add(tm,fm);
  }
  if(roofProps.length){
    const im=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),gm.prop,roofProps.length);
    im.castShadow=true;
    roofProps.forEach((p,i)=>{
      dm.position.set(p[0],p[1]+p[4]/2,p[2]);dm.scale.set(p[3],p[4],p[5]);
      dm.rotation.set(0,0,0);dm.updateMatrix();im.setMatrixAt(i,dm.matrix);});
    group.add(im);
  }
  if(lamps.length){
    const pm=new THREE.InstancedMesh(new THREE.CylinderGeometry(.10,.16,8,7),gm.metal,lamps.length);
    const hm=new THREE.InstancedMesh(new THREE.BoxGeometry(1.6,.30,.5),gm.lamp,lamps.length);
    pm.castShadow=true;
    lamps.forEach((l,i)=>{
      dm.scale.set(1,1,1);dm.rotation.set(0,0,0);
      const ly=terrainH(l[0],l[1]);
      dm.position.set(l[0],ly+4,l[1]);dm.updateMatrix();pm.setMatrixAt(i,dm.matrix);
      dm.position.set(l[0],ly+7.95,l[1]);dm.updateMatrix();hm.setMatrixAt(i,dm.matrix);});
    group.add(pm,hm);
  }
  scene.add(group);
  return group;
}

// Furuskog utenfor byen. Tettheten styres av støy så det blir lysninger, og
// bratte sider hoppes over slik at trærne ikke står ut av en klippe.
let skog=[];
function plantSkog(scene,gm){
  for(const m of skog)scene.remove(m);
  skog=[];
  const steg=11, plasser=[];
  for(let x=-HW+20;x<HW-20;x+=steg)for(let z=-HD+20;z<HD-20;z+=steg){
    if(Math.hypot(x/1.30,z)<900)continue;
    const tetthet=noise(x/210+61.3,z/210+29.7);
    if(tetthet<0.34)continue;
    const jx=x+rnd(-4.5,4.5), jz=z+rnd(-4.5,4.5);
    const y=terrainH(jx,jz);
    if(Math.abs(terrainH(jx+6,jz)-y)+Math.abs(terrainH(jx,jz+6)-y)>7.5)continue;
    if(rand()>0.34+tetthet*0.5)continue;
    plasser.push([jx,y,jz,rnd(.75,1.65),rand()*6.283]);
  }
  if(!plasser.length)return 0;
  const GX=6,GZ=4,celler=new Map();
  for(const q of plasser){
    const k=Math.min(GZ-1,Math.max(0,((q[2]+HD)/(CITY_D/GZ))|0))*GX+
            Math.min(GX-1,Math.max(0,((q[0]+HW)/(CITY_W/GX))|0));
    let a=celler.get(k); if(!a){a=[];celler.set(k,a);} a.push(q);
  }
  const stammeG=new THREE.CylinderGeometry(.20,.42,5.2,6);
  const kroneG=new THREE.ConeGeometry(2.35,9.5,7);
  const dm=new THREE.Object3D(), col=new THREE.Color();
  for(const arr of celler.values()){
    const sm=new THREE.InstancedMesh(stammeG,gm.bark,arr.length);
    const km=new THREE.InstancedMesh(kroneG,gm.gran,arr.length);
    sm.castShadow=true; km.castShadow=true; km.receiveShadow=true;
    km.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(arr.length*3),3);
    arr.forEach((q,i)=>{
      const x=q[0],y=q[1],z=q[2],sc=q[3],rot=q[4];
      dm.rotation.set(0,rot,0); dm.scale.set(sc,sc,sc);
      dm.position.set(x,y+2.6*sc,z); dm.updateMatrix(); sm.setMatrixAt(i,dm.matrix);
      dm.position.set(x,y+9.6*sc,z);
      dm.scale.set(sc*rnd(.85,1.15),sc*rnd(.9,1.3),sc*rnd(.85,1.15));
      dm.updateMatrix(); km.setMatrixAt(i,dm.matrix);
      col.setHSL(.30+rand()*.05,.34+rand()*.20,.13+rand()*.09);
      km.setColorAt(i,col);
    });
    km.instanceColor.needsUpdate=true;
    scene.add(sm,km); skog.push(sm,km);
  }
  return plasser.length;
}

/* Kenney Car Kit (CC0). Trafikk instanseres som én merget geometri per type;
   parkerte biler er ekte objekter med navngitte hjul, så de kan kjøres.      */
const CAR_TYPES=['sedan','sedan-sports','suv','suv-luxury','taxi','police',
                 'van','delivery','hatchback-sports','truck-flat','ambulance'];
const CAR_SCALE=1.75;            // modellen er ~2,55 m lang -> ~4,5 m
const CAR_YAW=0;                 // korrigerer modellens egen frontretning
let carGeo={},carMat=null,carSrc={},carMats={},carYoff={};
let traffic=[],carData=[],parked=[];
const drive={on:false,car:null,spd:0,vx:0,vy:0,yawrate:0,ax:0,slip:0,
              steer:0,head:0,spin:0,x:0,y:0,z:0,skade:0,rist:0};

async function loadCars(){
  const loader=new GLTFLoader();
  for(const t of CAR_TYPES){
    try{
      const g=await loader.loadAsync('assets/cars/'+t+'.glb');
      g.scene.updateMatrixWorld(true);
      const geos=[];
      g.scene.traverse(o=>{
        if(o.isMesh&&o.geometry){
          // quantize gir interleaved attributter — de må flates ut før merge.
          // deinterleaveGeometry muterer på stedet og returnerer ingenting.
          deinterleaveGeometry(o.geometry);
          const q=tilFloat32(o.geometry.clone());
          q.applyMatrix4(o.matrixWorld);
          q.deleteAttribute('tangent');      // ulike attributtsett bryter merge
          geos.push(q);
          if(!carMats[t])carMats[t]=o.material;
          if(!carMat)carMat=o.material;
        }
      });
      if(geos.length)carGeo[t]=mergeGeometries(geos,false);
      carSrc[t]=g.scene;
      // noen modeller ligger litt under origo — løft dem opp på bakken
      const bb=new THREE.Box3().setFromObject(g.scene);
      carYoff[t]=-bb.min.y;
    }catch(e){ console.warn('bilmodell mangler:',t,e.message); }
  }
  // Hver bil har sin egen KHR_texture_transform inn i det delte atlaset. Deles
  // ett materiale mellom typene, sampler de fleste feil område av teksturen.
  for(const t in carMats){
    const m=carMats[t];
    if(m&&m.isMeshStandardMaterial){m.roughness=.42;m.metalness=.30;m.envMapIntensity=1.15;}
  }
}

// Helte-biler: for tunge til trafikk (McLaren er 4,7 MB / 187k verteks), så de
// lastes etter at byen står, og settes ut som noen få parkerte eksemplarer.
const HERO_CARS=['mclaren'];
async function loadHeroCars(){

function placeHero(t,n){
  const ax=streetsX.find(s=>s.art&&s.p>-200)||streetsX[0];
  const az=streetsZ.find(s=>s.art&&s.p>-200)||streetsZ[0];
  spawnRealCar(t,ax.p+5.5,az.p+11,0);            // én rett ved der du starter

function buildTraffic(){

  const types=CAR_TYPES.filter(t=>carGeo[t]);
  if(!types.length)return;
  const ax=streetsX.filter(s=>s.art),az=streetsZ.filter(s=>s.art);

        off:line.p+(dir>0?4.8:-4.8),dir:dir,spd:rnd(9,20)});

function buildParked(){
  for(const p of parked)scene.remove(p.obj);
  parked=[];drive.on=false;drive.car=null;
  const types=CAR_TYPES.filter(t=>carSrc[t]);
  if(!types.length)return;
  for(const b of blocks){
    if(b.d===D_PARK||parked.length>=58)continue;
    if(rand()>.32)continue;
    const sides=[
      {ax:b.x0,az:b.z0,bx:b.x1,bz:b.z0,nx:0,nz:-1,yaw:Math.PI/2},
      {ax:b.x1,az:b.z0,bx:b.x1,bz:b.z1,nx:1,nz:0,yaw:0},
      {ax:b.x1,az:b.z1,bx:b.x0,bz:b.z1,nx:0,nz:1,yaw:Math.PI/2},
      {ax:b.x0,az:b.z1,bx:b.x0,bz:b.z0,nx:-1,nz:0,yaw:0}
    ];
    const s=sides[rndi(0,3)];
    const len=Math.hypot(s.bx-s.ax,s.bz-s.az);
    if(len<24)continue;
    const t=rnd(8,len-8),dx=(s.bx-s.ax)/len,dz=(s.bz-s.az)/len,off=3.0;
    const x=s.ax+dx*t+s.nx*off, z=s.az+dz*t+s.nz*off;
    spawnRealCar(types[rndi(0,types.length-1)],x,z,s.yaw+(rand()<.5?0:Math.PI)+CAR_YAW);
  }
}

// Lager en ekte, kjørbar bil. Brukes både til parkerte biler og når du kaprer
// en bil fra trafikken.
// Finner hjul. Kenney-modellene har navngitte hjul; Sketchfab-modeller (som
// McLaren-en) heter bare Object_N, og da må hjulene finnes på formen: lave,
// runde, ute i de fire hjørnene. Delene grupperes per hjørne i én pivot.
function rigWheels(root){
  root.updateMatrixWorld(true);
  const named=[];
  root.traverse(o=>{if(o.isMesh&&/wheel|tire|tyre|rim/i.test(o.name))named.push(o);});
  if(named.length>=4)
    return named.map(o=>({o:o,front:/front/i.test(o.name),by:o.rotation.y,bx:o.rotation.x}));

  const bb=new THREE.Box3().setFromObject(root);
  const W=bb.max.x-bb.min.x, H=bb.max.y-bb.min.y, L=bb.max.z-bb.min.z;
  const cands=[];
  root.traverse(o=>{
    if(!o.isMesh||!o.geometry)return;
    const b=new THREE.Box3().setFromObject(o),sz=new THREE.Vector3(),c=new THREE.Vector3();
    b.getSize(sz);b.getCenter(c);
    const rund=Math.abs(sz.y-sz.z)<Math.max(sz.y,sz.z)*0.42;
    if(c.y<bb.min.y+H*0.58 && rund && sz.y>H*0.28 &&
       Math.abs(c.x-(bb.min.x+W/2))>W*0.20 && Math.abs(c.z-(bb.min.z+L/2))>L*0.16)
      cands.push({o:o,c:c});
  });
  const grupper={};
  const mx=bb.min.x+W/2, mz=bb.min.z+L/2;
  for(const k of cands){
    const key=(k.c.x<mx?'L':'R')+(k.c.z<mz?'B':'F');
    (grupper[key]=grupper[key]||[]).push(k);
  }
  const out=[];
  for(const key in grupper){
    const g=grupper[key], midt=new THREE.Vector3();
    g.forEach(k=>midt.add(k.c)); midt.divideScalar(g.length);
    const pivot=new THREE.Group(); pivot.position.copy(midt); root.add(pivot);
    for(const k of g) pivot.attach(k.o);          // attach beholder verdenstransform
    out.push({o:pivot,front:key[1]==='F',by:0,bx:0});
  }
  return out;
}

function spawnRealCar(type,x,z,yaw){
  const obj=carSrc[type].clone(true);
  const wheels=rigWheels(obj);                    // rigges FØR skalering/plassering
  const sc=(type==='mclaren')?1.0:CAR_SCALE;      // McLaren er allerede i ekte skala
  obj.scale.setScalar(sc);
  obj.position.set(x,groundAt(x,z)+(carYoff[type]||0)*sc,z);
  obj.rotation.y=yaw;
  obj.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  scene.add(obj);
  const p={obj:obj,wheels:wheels,x:x,z:z,yaw:yaw,type:type,sc:sc,yoff:(carYoff[type]||0)*sc};
  parked.push(p);return p;
}
// nærmeste bil du kan sette deg inn i — parkert eller i fart
// Parkerte biler står ved fortauet; trafikken kjører midt i veien, ~10 m unna.
// Derfor egen, større radius for kapring.
const R_PARK=144, R_TRAF=440;      // ~12 m og ~21 m, kvadrert
function nearestCar(){
  let best=null,bd=R_PARK,tr=null,td=R_TRAF;
  for(const p of parked){
    const d=(p.x-P.pos.x)*(p.x-P.pos.x)+(p.z-P.pos.z)*(p.z-P.pos.z);
    if(d<bd){bd=d;best=p;}
  }
  for(const c of carData){
    if(c.dead)continue;
    const x=c.ax?c.off:c.pos, z=c.ax?c.pos:c.off;
    const d=(x-P.pos.x)*(x-P.pos.x)+(z-P.pos.z)*(z-P.pos.z);
    if(d<td){td=d;tr=c;}
  }
  if(best&&tr)return (bd<=td)?{p:best,tr:null,d2:bd}:{p:null,tr:tr,d2:td};
  return {p:best,tr:tr,d2:best?bd:td};
}

const _cd=new THREE.Object3D();
function updateCars(dt){
  for(const c of carData){
    if(c.dead){                                   // kapret — ute av trafikken
      _cd.position.set(0,-9999,0);_cd.scale.setScalar(0.0001);_cd.rotation.set(0,0,0);
      _cd.updateMatrix();c.m.setMatrixAt(c.i,_cd.matrix);continue;
    }
    c.pos+=c.spd*c.dir*dt;
    const lim=c.ax?HD:HW;
    if(c.pos>lim)c.pos=-lim; if(c.pos<-lim)c.pos=lim;
    let yaw;
    if(c.ax){_cd.position.set(c.off,terrainH(c.off,c.pos),c.pos);yaw=c.dir>0?0:Math.PI;}
    else    {_cd.position.set(c.pos,terrainH(c.pos,c.off),c.off);yaw=c.dir>0?Math.PI/2:-Math.PI/2;}
    _cd.rotation.set(0,yaw+CAR_YAW,0);
    _cd.scale.setScalar(CAR_SCALE);
    _cd.updateMatrix();c.m.setMatrixAt(c.i,_cd.matrix);
  }
  for(const m of traffic)m.instanceMatrix.needsUpdate=true;
}

// ---------------------------- KRASJ ---------------------------------------
// Bil mot bil og bil mot bygg. Treffer du en bil i trafikken blir den tatt ut
// av strømmen og gjort om til et ekte objekt med egen fart, så den blir dyttet
// og spinner videre i stedet for å bare stå der.
const KRASJ_R=2.7;                     // grov kollisjonsradius per bil
function friPlass(x,z){
  for(const b of nearby(x,z))
    if(x>b.x0-0.7&&x<b.x1+0.7&&z>b.z0-0.7&&z<b.z1+0.7)return false;
  return true;
}
function smell(kraft){
  drive.skade=cl(drive.skade+kraft*1.7,0,100);
  drive.rist=Math.min(1.4,drive.rist+kraft*0.10);
  if(kraft>4)showToast('💥 Smell — '+Math.round(drive.skade)+' % skade');
}
function dyttBil(p,nx,nz,vn,overlapp){
  drive.x-=nx*overlapp*0.55; drive.z-=nz*overlapp*0.55;
  p.x+=nx*overlapp*0.45; p.z+=nz*overlapp*0.45;
  if(vn<=0.4)return;
  p.vx=(p.vx||0)+nx*vn*0.90;
  p.vz=(p.vz||0)+nz*vn*0.90;
  p.spin=(p.spin||0)+(rand()-0.5)*vn*0.30;
  // ta farten ut av din egen bil, i verdenskoordinater
  const sh=Math.sin(drive.head), ch=Math.cos(drive.head);
  const wx=drive.vx*sh+drive.vy*ch, wz=drive.vx*ch-drive.vy*sh;
  const j=vn*0.72;
  const nwx=wx-nx*j, nwz=wz-nz*j;
  drive.vx=nwx*sh+nwz*ch; drive.vy=nwx*ch-nwz*sh;
  drive.yawrate+=(rand()-0.5)*vn*0.10;
  smell(vn);
}
function sjekkBilkrasj(){
  const sh=Math.sin(drive.head), ch=Math.cos(drive.head);
  const wx=drive.vx*sh+drive.vy*ch, wz=drive.vx*ch-drive.vy*sh;
  const D=KRASJ_R*2;
  // --- mot parkerte / allerede løse biler ---
  for(const p of parked){
    if(drive.car===p)continue;
    const dx=p.x-drive.x, dz=p.z-drive.z, d2=dx*dx+dz*dz;
    if(d2>D*D||d2<1e-6)continue;
    const d=Math.sqrt(d2), nx=dx/d, nz=dz/d;
    dyttBil(p,nx,nz,Math.max(0,wx*nx+wz*nz),D-d);
  }
  // --- mot biler i trafikk: gjøres om til ekte objekter ved treff ---
  for(const c of carData){
    if(c.dead)continue;
    const cx=c.ax?c.off:c.pos, cz=c.ax?c.pos:c.off;
    const dx=cx-drive.x, dz=cz-drive.z, d2=dx*dx+dz*dz;
    if(d2>D*D||d2<1e-6)continue;
    const d=Math.sqrt(d2), nx=dx/d, nz=dz/d;
    const vn=Math.max(0,wx*nx+wz*nz);
    if(vn<1.2&&d>D*0.82)continue;
    const yaw=(c.ax?(c.dir>0?0:Math.PI):(c.dir>0?Math.PI/2:-Math.PI/2))+CAR_YAW;
    c.dead=true;
    const p=spawnRealCar(c.type,cx,cz,yaw);
    p.vx=nx*c.spd*0.25; p.vz=nz*c.spd*0.25;
    dyttBil(p,nx,nz,vn,D-d);
  }
}
// Løse biler ruller videre til de stopper, og stanger ikke gjennom bygg.
function oppdaterLose(dt){
  for(const p of parked){
    if(drive.on&&drive.car===p)continue;
    if(!p.vx&&!p.vz&&!p.spin)continue;
    const fx=p.x,fz=p.z;
    p.x+=p.vx*dt; p.z+=p.vz*dt; p.yaw+=(p.spin||0)*dt;
    if(!friPlass(p.x,p.z)){p.x=fx;p.z=fz;p.vx*=-0.3;p.vz*=-0.3;p.spin*=0.4;}
    const dmp=Math.max(0,1-2.4*dt);
    p.vx*=dmp; p.vz*=dmp; p.spin*=dmp;
    if(Math.abs(p.vx)<0.06&&Math.abs(p.vz)<0.06&&Math.abs(p.spin)<0.06){
      p.vx=0;p.vz=0;p.spin=0;
    }
    p.obj.position.set(p.x,groundAt(p.x,p.z)+(p.yoff||0),p.z);
    p.obj.rotation.y=p.yaw;
  }
}

/* Kjørefysikk etter Marco Monsters «Car Physics for Games» (dynamisk modell).
   Bilen har egen lengde- og SIDEFART pluss girfart som tilstand. Sidekreftene
   kommer fra slippvinkler og er begrenset av friksjonssirkelen — når bakhjulene
   når grensen slipper bakenden og bilen sladder. Håndbrekket senker bakgrepet
   og starter driften.                                                        */
const CARP={
  M:1250, I:2500,          // treghetsmoment opp -> bilen snurrer ikke like lett
  b:1.25, c:1.35, h:0.55,
  Cf:60000, Cr:56000,      // mykere bak = progressiv sladd i stedet for brå spinn
  mu:1.45,
  muHand:0.55,             // håndbrekk løsner bakenden, men slipper den ikke helt
  gassLos:0.20,            // gass reduserer bakgrepet -> du doserer sladden med foten
  girDemp:2600,            // girdemping (N·m per rad/s) -> sladden er til å holde
  girTak:1.5,              // maks girfart
  sladdDemp:1.25,          // hvor fort sidefarten dør ut uten håndbrekk
  sladdDempH:0.22,         // ... med håndbrekk (nesten fritt slipp)
  motor:10000, boost:15000, brems:13500, revers:3400,
  cLuft:2.1, cRull:63, ratt:0.56
};

// Ett fysikk-delsteg. Alt her er Monsters modell; det eneste tillegget er
// gulvet på nevneren i slippvinklene, som holder den stabil rundt null fart.
function carStep(h,th,hand,boost){
  const L=CARP.b+CARP.c;
  const vx=drive.vx, vy=drive.vy, yr=drive.yawrate, d=drive.steer;
  const vmag=Math.hypot(vx,vy);
  // Fortegnsriktig vx med gulv på magnituden. Math.atan (ikke atan2) gir en
  // slippvinkel som alltid ligger innenfor ±90° — dermed peker dekkraften
  // alltid MOT skrensen, også når bilen står på tvers eller rygger.
  // Nevneren må være MAGNITUDEN av vx. Med fortegn snudde slippvinkelen når
  // bilen rygget eller sto på tvers, og dekkraften forsterket skrensen i
  // stedet for å rette den opp — bilen låste seg sidelengs for alltid.
  const av=Math.max(Math.abs(vx),3.0);
  const dirs=vx<0?-1:1;                        // rygging styrer motsatt
  const aF=Math.atan((vy+yr*CARP.b)/av)-d*dirs;
  const aR=Math.atan((vy-yr*CARP.c)/av);

  const W=CARP.M*9.81;
  let Wf=(CARP.c/L)*W-(CARP.h/L)*CARP.M*(drive.ax||0);
  let Wr=(CARP.b/L)*W+(CARP.h/L)*CARP.M*(drive.ax||0);
  Wf=Math.max(Wf,W*0.12); Wr=Math.max(Wr,W*0.12);

  // Gassen styrer bakgrepet: full gass løsner bakenden og forlenger sladden,
  // letter du på gassen tar den grep igjen og retter seg opp. Det er dette som
  // gjør at man kan velge mellom en myk kurve og en brå sving.
  const gass=th>0?1:0;
  const gripR=hand?CARP.muHand:CARP.mu*(1-CARP.gassLos*gass);
  const Ff=cl(-CARP.Cf*aF,-CARP.mu*Wf, CARP.mu*Wf);   // kraften motvirker slippet
  const Fr=cl(-CARP.Cr*aR,-gripR*Wr,   gripR*Wr  );

  let Ft=0;
  if(th>0)Ft+=(boost?CARP.boost:CARP.motor)*(1-drive.skade/100*0.45);   // skade tar krefter
  else if(th<0)Ft-=(vx>0.6)?CARP.brems:CARP.revers;
  if(hand)Ft-=Math.sign(vx)*CARP.brems*0.55;
  Ft-=CARP.cLuft*vx*Math.abs(vx);
  Ft-=CARP.cRull*vx;

  const ax=Ft/CARP.M+yr*vy;
  const ay=(Math.cos(d)*Ff+Fr)/CARP.M-yr*vx;
  drive.vx+=ax*h; drive.vy+=ay*h; drive.ax=ax;

  const moment=Math.cos(d)*Ff*CARP.b-Fr*CARP.c-CARP.girDemp*yr;   // demping = kontroll
  const dynYaw=drive.yawrate+(moment/CARP.I)*h;

  // Under ~3 m/s TOTAL fart er den dynamiske modellen meningsløs; da blandes
  // den mot kinematisk sykkelmodell så parkering og rygging blir rolig.
  const kinYaw=(Math.abs(vx)>0.15)?(vx*Math.tan(d)/L):0;
  const t=cl((vmag-3.0)/4.0,0,1);
  drive.yawrate=cl(kinYaw*(1-t)+dynYaw*t,-CARP.girTak,CARP.girTak);
  // Sidefarten dempes mot null når du IKKE holder håndbrekk. Det er dette som
  // gjør sladden styrbar: hold håndbrekket for å holde den gående, slipp for
  // å hekte den opp igjen.
  const sd=hand?CARP.sladdDempH:CARP.sladdDemp;
  drive.vy-=drive.vy*Math.min(1,sd*h);
  drive.vy=cl(drive.vy*((1-t)*0.90+t),-26,26);
  drive.head+=drive.yawrate*h;

  if(th===0&&!hand&&vmag<0.4){drive.vx=0;drive.vy=0;drive.yawrate=0;}
  drive.vx=Math.max(-9,drive.vx);
}

function updateDrive(dt){
  const th=(keys['KeyW']?1:0)-(keys['KeyS']?1:0);
  const st=(keys['KeyA']?1:0)-(keys['KeyD']?1:0);
  const hand=!!keys['Space'];
  const boost=!!(keys['ShiftLeft']||keys['ShiftRight']);
  const D=Math.min(dt,0.05);

  // ratt settes én gang per frame
  const maxRatt=CARP.ratt/(1+(Math.abs(drive.vx)/15)*(Math.abs(drive.vx)/15));
  drive.steer+=(st*maxRatt-drive.steer)*Math.min(1,D*7);

  // Kreftene mettes, og da blir eksplisitt Euler ustabil ved store slippvinkler
  // — den destruerte fart. Derfor deles steget i biter på ~5 ms.
  const N=Math.max(1,Math.ceil(D/0.005));
  const h=D/N;
  for(let k=0;k<N;k++)carStep(h,th,hand,boost);

  drive.spd=drive.vx;                          // fartsmåler + hjulrotasjon
  const vmag=Math.hypot(drive.vx,drive.vy);
  drive.slip=vmag>3?Math.atan2(Math.abs(drive.vy),Math.abs(drive.vx)):0;

  const sh=Math.sin(drive.head), ch=Math.cos(drive.head);
  const wx=drive.vx*sh+drive.vy*ch;            // fart i verdenskoordinater
  const wz=drive.vx*ch-drive.vy*sh;
  const fx=sh, fz=ch;
  const nx=drive.x+wx*Math.min(dt,0.05), nz=drive.z+wz*Math.min(dt,0.05);
  let hit=false;
  if(!drive.nocol)for(const o of [-2.0,0,2.0]){
    const px=nx+fx*o,pz=nz+fz*o;
    for(const b of nearby(px,pz))
      if(px>b.x0-0.9&&px<b.x1+0.9&&pz>b.z0-0.9&&pz<b.z1+0.9){hit=true;break;}
    if(hit)break;
  }
  if(hit){
    smell(Math.hypot(drive.vx,drive.vy)*0.55);      // smell i bygg
    drive.vx*=-0.25;drive.vy*=0.2;drive.yawrate*=0.3;drive.hits=(drive.hits||0)+1;
  }
  else {drive.x=nx;drive.z=nz;}
  drive.x=cl(drive.x,-HW+8,HW-8);drive.z=cl(drive.z,-HD+8,HD-8);

  drive.spin+=drive.spd*dt/0.34;   // hjulradius ~0,34 m
  const o=drive.car.obj;
  drive.y=groundAt(drive.x,drive.z);
  o.position.set(drive.x,drive.y+(drive.car.yoff||0),drive.z);
  o.rotation.y=drive.head+CAR_YAW;
  for(const w of drive.car.wheels){
    w.o.rotation.x=w.bx-drive.spin;
    if(w.front)w.o.rotation.y=w.by+drive.steer*.85;
  }
  sjekkBilkrasj();
  drive.rist=Math.max(0,drive.rist-dt*2.2);
  P.pos.set(drive.x,drive.y+1.4,drive.z);P.yaw=drive.head+Math.PI;
}

            fartEtter:Math.round(Math.abs(drive.vx)*3.6),
            nyeObjekter:parked.length-for_,
            loseBiler:parked.filter(q=>q.vx||q.vz||q.spin).length};
  },
  frihimmel:()=>{drive.x=0;drive.z=0;drive.head=0;      // tom flate, ingen bygg
                 drive.vx=drive.vy=drive.yawrate=drive.hits=0;},
  trace:(steps,ks,every,dt)=>{
    for(const k in ks)keys[k]=ks[k];
    const out=[];
    for(let i=0;i<steps;i++){
      updateDrive(dt||0.016);
      if(i%every===0)out.push({i:i,vx:+drive.vx.toFixed(1),vy:+drive.vy.toFixed(1),
        fart:+Math.hypot(drive.vx,drive.vy).toFixed(1),yr:+drive.yawrate.toFixed(2),
        ratt:+drive.steer.toFixed(2)});
    }
    for(const k in ks)keys[k]=false;
    return out;
  },
  sim:(steps,ks,dt)=>{                         // kjør fysikken uten å rendre
    for(const k in ks)keys[k]=ks[k];
    for(let i=0;i<(steps||60);i++)updateDrive(dt||0.016);
    for(const k in ks)keys[k]=false;
    const h=drive.hits||0; drive.hits=0;
    return {kmt:Math.round(Math.abs(drive.vx)*3.6), krasj:h,
            vx:+drive.vx.toFixed(2), vy:+drive.vy.toFixed(2),
            girfart:+drive.yawrate.toFixed(3),
            sladd_grader:+(drive.slip*180/Math.PI).toFixed(1)};
  },
  drive:()=>({on:drive.on,type:drive.car?drive.car.type:null,
              spd:+drive.spd.toFixed(2),kmt:Math.round(Math.abs(drive.spd)*3.6),
              hjul:drive.car?drive.car.wheels.length:0,y:+drive.y.toFixed(1)}),
  enterExit:()=>enterExit(),
  keys:()=>Object.keys(keys).filter(k=>keys[k]),
  diag:()=>{
    const fx=Math.sin(drive.head),fz=Math.cos(drive.head);
    let hits=0;
    for(const o of [-2.0,0,2.0]){
      const px=drive.x+fx*o,pz=drive.z+fz*o;
      for(const b of nearby(px,pz))
        if(px>b.x0-0.9&&px<b.x1+0.9&&pz>b.z0-0.9&&pz<b.z1+0.9){hits++;break;}
    }
    return {kollisjonspunkter:hits,x:+drive.x.toFixed(1),z:+drive.z.toFixed(1),
            naboer:nearby(drive.x,drive.z).length};
  },
  toTraffic:()=>{                     // still spilleren ved siden av en bil i fart
    const c=carData.find(q=>!q.dead); if(!c)return null;
    const x=c.ax?c.off:c.pos, z=c.ax?c.pos:c.off;
    P.pos.set(x+3,groundAt(x+3,z+3)+1.75,z+3); P.fly=false;
    return {x:Math.round(x),z:Math.round(z),type:c.type};
  },
  near:()=>{const n=nearestCar();
    return {parkert:!!n.p,trafikk:!!n.tr,avstand:+Math.sqrt(n.d2).toFixed(1)};},
  terr:()=>{let mn=1e9,mx=-1e9;
    for(let x=-1200;x<=1200;x+=60)for(let z=-800;z<=800;z+=60){
      const h=terrainH(x,z); if(h<mn)mn=h; if(h>mx)mx=h;}
    return {min:+mn.toFixed(1),maks:+mx.toFixed(1),spenn:+(mx-mn).toFixed(1)};},
  cars:()=>({geo:Object.keys(carGeo).length,src:Object.keys(carSrc).length,
             traffic:traffic.length,data:carData.length,parked:parked.length,
             mat:!!carMat,
             firstGeo:traffic[0]?traffic[0].geometry.attributes.position.count:-1,
             p0:parked[0]?[Math.round(parked[0].x),Math.round(parked[0].z),parked[0].type]:null})
};

const fw=new THREE.Vector3(),rt=new THREE.Vector3(),wish=new THREE.Vector3();
const _cam=new THREE.Vector3();
function update(dt){
  if(drive.on){
    updateDrive(dt);
    _cam.set(drive.x-Math.sin(drive.head)*8.6, drive.y+3.7, drive.z-Math.cos(drive.head)*8.6);
    camera.position.lerp(_cam,Math.min(1,dt*5.5));
    if(drive.rist>0.001){                       // kameraet rister etter et smell
      const r=drive.rist;
      camera.position.x+=(Math.random()-.5)*r;
      camera.position.y+=(Math.random()-.5)*r*0.7;
      camera.position.z+=(Math.random()-.5)*r;
    }
    camera.rotation.set(0,0,0);
    camera.lookAt(drive.x,drive.y+1.5,drive.z);
    sky.position.copy(camera.position);
    sun.position.copy(camera.position).addScaledVector(SUN_DIR,320);
    sun.target.position.set(drive.x,0,drive.z);sun.target.updateMatrixWorld();
    return;
  }
  fw.set(-Math.sin(P.yaw),0,-Math.cos(P.yaw));rt.set(fw.z,0,-fw.x);
  wish.set(0,0,0);
  if(keys['KeyW'])wish.add(fw); if(keys['KeyS'])wish.sub(fw);
  if(keys['KeyD'])wish.add(rt); if(keys['KeyA'])wish.sub(rt);
  if(wish.lengthSq()>0)wish.normalize();
  const sprint=keys['ShiftLeft']||keys['ShiftRight'];

  if(P.fly){
    const spd=sprint?200:62;
    const up=(keys['Space']?1:0)-(keys['ControlLeft']?1:0);
    P.pos.addScaledVector(wish,spd*dt);
    P.pos.y+=(up*spd+(keys['KeyW']?Math.sin(P.pitch)*spd:0)-(keys['KeyS']?Math.sin(P.pitch)*spd:0))*dt;
    P.pos.y=Math.max(groundAt(P.pos.x,P.pos.z)+2,P.pos.y);
  } else {
    const spd=sprint?11.5:5.2, acc=P.onGround?52:12;
    P.vel.x+=(wish.x*spd-P.vel.x)*Math.min(1,acc*dt);
    P.vel.z+=(wish.z*spd-P.vel.z)*Math.min(1,acc*dt);
    P.vel.y-=24*dt;
    if(keys['Space']&&P.onGround){P.vel.y=8.2;P.onGround=false;}
    P.pos.x+=P.vel.x*dt;P.pos.z+=P.vel.z*dt;P.pos.y+=P.vel.y*dt;

    const list=nearby(P.pos.x,P.pos.z), feet=P.pos.y-P.h;
    for(const b of list){
      if(feet+.05>=b.top)continue;
      const nx=Math.max(b.x0,Math.min(P.pos.x,b.x1)),nz=Math.max(b.z0,Math.min(P.pos.z,b.z1));
      const dx=P.pos.x-nx,dz=P.pos.z-nz,d2=dx*dx+dz*dz;
      if(d2<P.r*P.r){
        if(d2>1e-5){
          const d=Math.sqrt(d2),push=P.r-d;
          P.pos.x+=dx/d*push;P.pos.z+=dz/d*push;
          const vn=P.vel.x*(dx/d)+P.vel.z*(dz/d);
          if(vn<0){P.vel.x-=vn*(dx/d);P.vel.z-=vn*(dz/d);}
        } else {
          const l=P.pos.x-b.x0,r2=b.x1-P.pos.x,f=P.pos.z-b.z0,k=b.z1-P.pos.z,m=Math.min(l,r2,f,k);
          if(m===l)P.pos.x=b.x0-P.r;else if(m===r2)P.pos.x=b.x1+P.r;
          else if(m===f)P.pos.z=b.z0-P.r;else P.pos.z=b.z1+P.r;
        }
      }
    }
    let g=groundAt(P.pos.x,P.pos.z);
    for(const b of list)
      if(P.pos.x>b.x0-.3&&P.pos.x<b.x1+.3&&P.pos.z>b.z0-.3&&P.pos.z<b.z1+.3)
        if(b.top>g&&P.pos.y-P.h>=b.top-.8)g=b.top;
    if(P.pos.y-P.h<=g){P.pos.y=g+P.h;P.vel.y=0;P.onGround=true;}else P.onGround=false;
  }
  P.pos.x=Math.max(-HW+6,Math.min(HW-6,P.pos.x));
  P.pos.z=Math.max(-HD+6,Math.min(HD-6,P.pos.z));

  camera.position.copy(P.pos);
  camera.rotation.order='YXZ';
  camera.rotation.y=P.yaw;camera.rotation.x=P.pitch;camera.rotation.z=0;
  sky.position.copy(P.pos);
  sun.position.copy(P.pos).addScaledVector(SUN_DIR,320);
  sun.target.position.copy(P.pos);sun.target.updateMatrixWorld();
}

   GATE-PROPS  (Poly Haven, CC0)
   Fotoskannede modeller desimert til ~12% og teksturer ned til 512px webp.
   Instansert per romlig rute, ellers tegnes hele byens props hver frame.
   ========================================================================== */
const PROP_DEF=[
  // navn,                     maks,  plassering,  y
  ['metal_trash_can',           240, 'kerb',   0   ],
  ['fire_hydrant',              150, 'kerb',   0   ],
  ['street_lamp_01',            110, 'kerb',   0   ],
  ['modular_street_seating',    100, 'kerb',   0   ],
  ['concrete_road_barrier',      80, 'kerb',   0   ],
  ['concrete_road_barrier_02',   70, 'kerb',   0   ],
  ['old_tyre',                   80, 'kerb',   0   ],
  ['utility_box_01',            110, 'wall',   0   ],
  ['utility_box_02',            100, 'wall',   0   ],
  ['rollershutter_door',         70, 'wall',   0   ],
  ['barrel_stove',               50, 'wall',   0   ],
  ['modular_chainlink_fence',    60, 'wall',   0   ],
  ['exterior_aircon_unit',      190, 'wall',   3.4 ],
  ['modular_fire_escape',        60, 'wall',   4.2 ],
  ['security_camera_01',         80, 'wall',   4.6 ],
  ['water_manhole_cover',       160, 'road',   0.02]
];
const PGX=5, PGZ=4;                       // grovere rutenett enn bygningene
let propGroup=null;

function propSpots(){
  const kerb=[],wall=[],road=[];
  for(const b of blocks){
    if(b.d===D_PARK)continue;
    const inset=b.d===D_RES?5:4;
    const sides=[
      {ax:b.x0,az:b.z0,bx:b.x1,bz:b.z0,nx:0,nz:1},
      {ax:b.x1,az:b.z0,bx:b.x1,bz:b.z1,nx:-1,nz:0},
      {ax:b.x1,az:b.z1,bx:b.x0,bz:b.z1,nx:0,nz:-1},
      {ax:b.x0,az:b.z1,bx:b.x0,bz:b.z0,nx:1,nz:0}
    ];
    for(const s of sides){
      const len=Math.hypot(s.bx-s.ax,s.bz-s.az);
      if(len<14)continue;
      const dx=(s.bx-s.ax)/len,dz=(s.bz-s.az)/len;
      const out=Math.atan2(-s.nx,-s.nz);       // vender ut mot gata
      for(let t=4;t<len-4;t+=rnd(7,17)){
        const o=rnd(1.0,2.1);
        kerb.push({x:s.ax+dx*t+s.nx*o,z:s.az+dz*t+s.nz*o,yaw:out+rnd(-.14,.14),y:b.pad});
      }
      for(let t=4;t<len-4;t+=rnd(10,26)){
        const o=inset-rnd(.15,.55);
        wall.push({x:s.ax+dx*t+s.nx*o,z:s.az+dz*t+s.nz*o,yaw:out,y:b.pad});
      }
      for(let t=8;t<len-8;t+=rnd(34,80)){
        const o=-rnd(3.5,7.5);
        const rx=s.ax+dx*t+s.nx*o, rz=s.az+dz*t+s.nz*o;
        road.push({x:rx,z:rz,yaw:rand()*6.283,y:terrainH(rx,rz)});
      }
    }
  }
  const sh=a=>{for(let i=a.length-1;i>0;i--){const j=(rand()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
  return {kerb:sh(kerb),wall:sh(wall),road:sh(road)};
}

async function loadProps(){
  if(propGroup){scene.remove(propGroup);}
  propGroup=new THREE.Group();scene.add(propGroup);
  const pools=propSpots(), loader=new GLTFLoader(), dm=new THREE.Object3D();
  let placed=0,failed=0;
  for(const [name,maxN,where,yoff] of PROP_DEF){
    let gltf;
    try{ gltf=await loader.loadAsync('assets/'+name+'.glb'); }
    catch(e){ failed++; continue; }
    const pool=pools[where]||pools.kerb;
    const picks=pool.splice(0,Math.min(maxN,pool.length));
    if(!picks.length)continue;
    // grupper etter rute slik at frustum culling faktisk virker
    const cells=new Map();
    for(const p of picks){
      const k=Math.min(PGZ-1,Math.max(0,((p.z+HD)/(CITY_D/PGZ))|0))*PGX+
              Math.min(PGX-1,Math.max(0,((p.x+HW)/(CITY_W/PGX))|0));
      let a=cells.get(k); if(!a){a=[];cells.set(k,a);} a.push(p);
    }
    const meshes=[];
    gltf.scene.updateMatrixWorld(true);
    gltf.scene.traverse(o=>{if(o.isMesh&&o.geometry)meshes.push(o);});
    for(const m of meshes){
      const base=m.geometry.clone(); base.applyMatrix4(m.matrixWorld);
      for(const arr of cells.values()){
        const im=new THREE.InstancedMesh(base,m.material,arr.length);
        im.castShadow=true; im.receiveShadow=true;
        arr.forEach((p,i)=>{
          dm.position.set(p.x,p.y+yoff,p.z);   // p.y er platå- eller terrenghøyde
          dm.rotation.set(0,p.yaw,0); dm.scale.set(1,1,1);
          dm.updateMatrix(); im.setMatrixAt(i,dm.matrix);
        });
        im.instanceMatrix.needsUpdate=true;
        im.computeBoundingSphere();
        propGroup.add(im);
      }
    }
    placed+=picks.length;
  }
  const el=document.getElementById('propcount');
  if(el)el.textContent=placed.toLocaleString('nb-NO')+(failed?' ('+failed+' mangler)':'');
  return placed;
}

function netClean(){

  try{ if(net.peer&&!net.peer.destroyed) net.peer.destroy(); }catch(e){}
  net.peer=null; net.hostConn=null; net.conns.clear();
}
function goLive(){
  if(net.live) return;
  net.live=true;
  $('share').style.display='block';
  const url=location.origin+location.pathname+(ROOM!=='FELLES'?'?rom='+ROOM:'');
  $('shareUrl').value=url;

               setTimeout(()=>$('shareCopy').textContent='Kopier',1500);})
    .catch(()=>$('shareUrl').select());
  setInterval(netTick,NET_TICK);
  plist();
}

function connectAsClient(){
  netClean(); net.settled=false; net.isHost=false;
  netSay('kobler til …');
  net.peer=new Peer(ICE);

  net.peer.on('open',id=>{
    net.id=id;
    net.hostConn=net.peer.connect(NET_PREFIX+ROOM,{reliable:false});
    net.timer=setTimeout(()=>{
      if(!net.settled&&(!net.hostConn||!net.hostConn.open)) becomeHost();
    },12000);

    net.hostConn.on('open',()=>{
      net.settled=true;
      if(net.timer){clearTimeout(net.timer); net.timer=null;}
      net.tries=0; netSay('tilkoblet','ok'); goLive();
    });

    net.hostConn.on('data',d=>{
      if(d.t!=='w') return;
      // vertens by er fasit
      if(d.seed!==undefined&&d.seed!==SEED){ SEED=d.seed; build(); spawn(); }
      const seen=new Set();
      for(const p of d.p){
        if(p.id===net.id) continue;
        seen.add(p.id);
        const o=others.get(p.id)||addOther(p.id,p.n,p.c);
        takeState(o,p);
      }
      for(const id of [...others.keys()]) if(!seen.has(id)) dropOther(id);
    });

    net.hostConn.on('close',()=>{
      if(!net.live||net.isHost) return;
      showToast('Verten dro — kobler om …');
      for(const id of [...others.keys()]) dropOther(id);
      setTimeout(connectAsClient,500+Math.random()*1500);
    });
  });

  net.peer.on('error',e=>{
    if(e.type==='peer-unavailable'){ if(!net.settled) becomeHost(); }
    else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){
      if(++net.tries<5) setTimeout(connectAsClient,1200*net.tries);
      else { netSay('ingen nettforbindelse — spiller alene','bad'); goLive(); }
    }
  });
}

function becomeHost(){
  if(net.isHost&&net.peer&&!net.peer.destroyed) return;
  net.settled=true; netClean();
  netSay('starter byen …');
  net.peer=new Peer(NET_PREFIX+ROOM,ICE);

  net.peer.on('open',id=>{
    net.isHost=true; net.id=id; net.tries=0;
    netSay('du er vert','ok'); goLive();
  });

  net.peer.on('connection',c=>{
    const gammel=net.conns.get(c.peer);
    if(gammel&&gammel!==c){ try{gammel.close();}catch(e){} }
    net.conns.set(c.peer,c);
    c.on('data',d=>{
      if(d.t==='s'){
        const o=others.get(c.peer)||addOther(c.peer,d.n,d.c);
        takeState(o,d);
      }
    });
    const bye=()=>{ net.conns.delete(c.peer); dropOther(c.peer); };
    c.on('close',bye); c.on('error',bye);
  });

  net.peer.on('error',e=>{
    if(e.type==='unavailable-id'){
      net.isHost=false;
      setTimeout(connectAsClient,600+Math.random()*1400);
    }else if(!net.live){
      if(++net.tries<5) setTimeout(connectAsClient,1200*net.tries);
      else { netSay('ingen nettforbindelse — spiller alene','bad'); goLive(); }
    }
  });
}

function netTick(){
  const me={n:net.name,c:net.col,x:P.pos.x,y:P.pos.y,z:P.pos.z,yaw:P.yaw};
  if(net.isHost){
    const arr=[{id:net.id,...me}];
    for(const [id,o] of others)
      arr.push({id,n:o.name,c:o.col,x:o.tx,y:o.ty,z:o.tz,yaw:o.tyaw});
    const pkt={t:'w',seed:SEED,p:arr};
    for(const [id,c] of [...net.conns]){
      if(c.open) c.send(pkt);
      else if(c.peerConnection&&c.peerConnection.connectionState==='failed'){
        net.conns.delete(id); dropOther(id);
      }
    }
    const now=performance.now();
    for(const [id,o] of [...others]) if(now-o.last>6000) dropOther(id);
  }else if(net.hostConn&&net.hostConn.open){
    net.hostConn.send({t:'s',...me});
  }
}

// glatt ut andres bevegelse mellom pakkene
function netInterp(dt){
  const k=Math.min(1,dt*12);
  for(const o of others.values()){
    o.x+=(o.tx-o.x)*k; o.y+=(o.ty-o.y)*k; o.z+=(o.tz-o.z)*k;
    let da=o.tyaw-o.yaw;
    while(da>Math.PI) da-=Math.PI*2;
    while(da<-Math.PI) da+=Math.PI*2;
    o.yaw+=da*k;
    // pos.y er øyehøyde, så føttene ligger 1.75 lavere
    o.mesh.position.set(o.x,o.y-1.75,o.z);
    o.mesh.rotation.y=o.yaw;
  }
}

$('pname').addEventListener('input',e=>{
  net.name=(e.target.value||'').trim().slice(0,12)||net.name;
  plist();
});
$('pname').addEventListener('keydown',e=>{ e.stopPropagation(); });
$('pname').addEventListener('click',e=>{ e.stopPropagation(); });

/* ---------------------------- LOOP -------------------------------------- */
let last=performance.now(),fa=0,fn=0,ht=0,FRAMES=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000;last=now;if(dt>.1)dt=.1;
  FRAMES++;
  update(dt);updateCars(dt);oppdaterLose(dt);netInterp(dt);
  if(toastT>0){toastT-=dt;if(toastT<=0)showMode();}
  renderer.render(scene,camera);
  fa+=1/Math.max(dt,1e-4);fn++;ht+=dt;
  if(ht>.25){
    document.getElementById('fps').textContent=Math.round(fa/fn);fa=0;fn=0;ht=0;
    document.getElementById('pos').textContent=Math.round(P.pos.x)+', '+Math.round(P.pos.z);
    document.getElementById('alt').textContent=Math.round(P.pos.y);
    document.getElementById('district').textContent=
      D_NAME[isPark(P.pos.x,P.pos.z)?D_PARK:districtAt(P.pos.x,P.pos.z)];
    if(drive.on){showMode();}
    else if(toastT<=0){
      const n=nearestCar();
      document.getElementById('mode').textContent=
        (n.p||n.tr)?'🚗 Trykk E for å '+(n.tr?'kapre bilen':'kjøre'):(P.fly?'✈ FLY-MODUS (F for å lande)':'');
    }
    drawMinimap();plist();
  }
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);});

setTimeout(async ()=>{
  await loadCars();
  build();spawn();applyTime();
  document.getElementById('load').style.display='none';
  document.getElementById('overlay').style.display='flex';
  requestAnimationFrame(loop);
  loadProps().then(loadHeroCars);      // tyngste last helt til slutt
  connectAsClient();          // kobler opp mens spilleren leser overlayet
},30);
</script>
